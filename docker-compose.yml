# API de Fleetier. Se publica bajo /api del mismo dominio que el front,
# y habla con la base por la red interna que crea bd-fleetier.
name: fleetier-back

services:
  back:
    build: .
    container_name: fleetier-back
    restart: unless-stopped
    environment:
      PGHOST: fleetier-db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      CLAVE_INICIAL: ${CLAVE_INICIAL:?definir CLAVE_INICIAL en .env}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      CLAVE_CUENTAS: ${CLAVE_CUENTAS:-}
      # Documentación de la API en /api/docs. Apagada salvo que el .env diga "true".
      SWAGGER_HABILITADO: ${SWAGGER_HABILITADO:-false}
    networks:
      - proxy      # para que Traefik lo publique
      - interna    # para hablar con la base
    labels:
      - traefik.enable=true
      - traefik.http.routers.fleetier-api.rule=Host(`${APP_HOST:?definir APP_HOST en .env}`) && PathPrefix(`/api`)
      - traefik.http.services.fleetier-api.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
  interna:
    name: fleetier_interna
    external: true
